[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-hub-api"
version = "1.0.0"
description = "Connect-Hub FastAPI Modular MVC Backend with SQLAlchemy 2.0, Multi-DB support, PeerJS WebRTC, and S3/R2 storage"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Connect-Hub Team", email = "dev@connecthub.app" }
]
keywords = [
    "fastapi",
    "social-network",
    "webrtc",
    "peerjs",
    "sqlalchemy",
    "websockets",
    "alembic"
]
dynamic = ["dependencies"]

[tool.uv]
package = false

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
